name: Compile VN's CV

on:
  push:
    branches:
      - vn

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install fonts
      run: |
        apt update
        apt install --yes \
          fonts-roboto \
          fonts-adobe-sourcesans3 \
          ;

    - name: Compile
      run: make

    - uses: actions/upload-artifact@v6
      with:
        name: vn-cv
        path: varun/cv.pdf
