name: Compile VN's CV

on:
  push:
    branches:
      - vn
    paths:
      - 'varun/**/*.tex'
      - 'awesome-cv.cls'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install fonts
      run: |
        apt update
        apt install -y fonts-roboto
        # Install Adobe Source Sans 3 manually
        apt install -y wget fontconfig
        mkdir -p /usr/local/share/fonts/source-sans-3
        wget -qO /tmp/source-sans.zip \
          https://github.com/adobe-fonts/source-sans/releases/latest/download/OTF-source-sans-3.zip
        unzip /tmp/source-sans.zip -d /usr/local/share/fonts/source-sans-3
        fc-cache -fv

    - name: Compile
      run: make

    - name: Mark repo safe for git
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Commit compiled PDF
      uses: EndBug/add-and-commit@v9
      with:
        author_name: github-actions[bot]
        author_email: 41898282+github-actions[bot]@users.noreply.github.com
        message: "chore: Update compiled pdf files"
        add: varun/cv.pdf
        push: true
